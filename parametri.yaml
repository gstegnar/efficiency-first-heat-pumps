    cena_CO2_faktor: [0.5, 1.5]                   # država
    ojacitev_EUR_kW: [300, 1200]                  # država; Meunier et al. 2021 razpon na stanovanje, PREVERI
    EF_2050: [0.3, 0.7]                           # okolje/država: faktor EF elektrike v 2050
  # Monte Carlo: trikotne porazdelitve (min, modus, max) za iste parametre
