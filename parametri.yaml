    vgrajeno_faktor: [0.7, 1.0, 1.3]

# ---------------------------------------------------------------- populacija (korak 08)
populacija:
  # tok novih TČ v eno-/dvostanovanjskih stavbah Q1+Q2 brez ovoja ob vgradnji: povprečje 2023–2024 (tabele/01_novi_letno.csv)
  novi_letno: 5633
