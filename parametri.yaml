# ---------------------------------------------------------------- država, krog 2 (javni proračun in družbena CBA)
drzava_k2:
  diskont: 0.03                       # realno, EU Better Regulation Toolbox #64
  # strošek zmogljivosti: letni »break-even cost« OCGT v ERAA 2025 (ACER Decision 06/2026, odst. o kalibraciji tveganja):
  # 62 EUR/kW za OCGT, 113 EUR/kW za CCGT; OCGT CAPEX 541,2 EUR/kW, FOM 22,4 EUR/kW/leto (op. 19)
  # https://www.acer.europa.eu/sites/default/files/documents/Individual%20Decisions/ACER-Decision-06-2026-ERAA-2025.pdf
  zmogljivost_EUR_kW_leto: 62
  zmogljivost_obcutljivost_EUR_kW_leto: 113
  # zimska elektrika: osnovno urne cene SI 2025; scenarij višjih zimskih cen (nov–feb) — faktor na urno ceno PREVERI
  zimska_cena_faktor_scenarij: 1.5
  # distribucijsko (NN) omrežje (krog 2, Gašper 12. 10. 2026: osnovni izračun, 670 EUR/kW kot drzava.ojacitev_EUR_kW):
  # izvod mora prenesti večjo od sočasne konice uvoza (zima) in sočasne konice oddaje PV (poletje) — ne vsote, ker nastopita ob različnih urah.
  # Sočasna konica na hišo = povprečni uvoz (oddaja) hiše v N urah največjega skupnega uvoza (oddaje) flote iste variante (osnovni tek 03).
  # Nadomesti ojačitev po prispevku k nacionalni sistemski konici (krog 1); zmogljivost ostane na sistemski konici. PREVERI N in EUR/kW.
  distribucija_ur_konice: 10
  # ojačitev omrežja: obstoječi 670 EUR/kW (Gašper, PREVERI); literatura 200–1.230 EUR/stanovanje (Meunier et al. 2021)
  # vzdrževanje in investicije v Eko skladovih podatkih vključujejo DDV → v družbeni CBA brez DDV (÷ 1 + DDV)

# ---------------------------------------------------------------- krog 4 (NAVODILA_CLAUDE_CODE_v4, 12. 10. 2026)
krog4:
  # K4_1: dodatna stanja ovoja (Gašper 12. 10. 2026, odločitev 3): isti U kot lestvica (fasada 0,30, streha 0,20, okna 1,3), brez tal;
  # n50 ≤ 5 le ob zamenjavi oken (kot S1/S2). Ciljna prenova iz stanja: manjkajoči ukrepi po krog3.cilj, celovita ≤ 50 kWh/m²a (zaostritev g).
  stanja_dodatna:
    SF: {stena: 0.30}
    SS: {streha: 0.20}
    SFO: {stena: 0.30, okna: 1.3, n50_max: 5.0}
    SFS: {stena: 0.30, streha: 0.20}
  # sestava ukrepov (register) → stanje; tla se upoštevajo le pri S3 (kot lestvica); »samo tla / drugo« → S0 (najbližje po fiziki)
  sestava_stanje:
    "S3 fasada+streha+okna (+tla) / celovita": S3
    "S2 streha+okna": S2
    "S1 okna": S1
    "samo fasada": SF
    "fasada+okna": SFO
    "fasada+streha": SFS
    "samo streha": SS
    "samo tla / drugo": BREZ
  # odločitev 1c: osnova šteje vse ukrepe GURS (tudi streho); občutljivost: streha samo iz Eko sklada (GURS »obnova strehe« = kritina)
  # ujemanje (CEM) s fondom zaklenjenih (29.977): obdobje, kvartil površine, regija, leto TČ (razredi), nadomeščeni energent
  cem_leta_TC_meje: [2015, 2019, 2022]
  cem_energenti: [ELKO, biomasa, plin]
  # K4_2 »PV brez TČ«: pričakovana vgradnja TČ po Kaplan–Meier (prva ogrevalna TČ po letu PV, eno-/dvostanovanjske, obdobje 1–4, brez ovoja);
  # po zadnjem opazovanem trajanju konstantna hazardna stopnja = povprečje zadnjih km_rep_let let s podporo
  km_rep_let: 3
  km_min_tveganje: 100                # hazard ocenjen le pri ≥ 100 hišah v tveganju, sicer rep
  km_horizonti: [3, 5, 10]
  # PV, priključen do 31. 12. net_metering_priklop_do (Gašper 13. 10. 2026: do konca 2024), je na letnem net meteringu (R1); PV, priključen pozneje: R3.
  # Krog 7 (Gašper 13. 10. 2026): režim velja do spremembe zakonodaje ali do konca življenjske dobe PV (ZSROVE-1, 115. člen; varstvo pri dobavitelju
  # do 31. 12. 2030, 101. in 116. člen). Osnova: R1 do konca življenjske dobe PV (leto PV + zivljenjska_doba_PV − 1; zamenjava razsmernika režima ne prekine),
  # nato R3; občutljivost (sprememba zakonodaje): R1 do konca leta net_metering_obcutljivost, nato R3.
  net_metering_priklop_do: 2024
  net_metering_konec: "zivljenjska_doba"
  zivljenjska_doba_PV: 30                       # kot v 04 (ostanek vrednosti PV, 30 let)
  net_metering_obcutljivost: [2030, 2034]       # 2030 konec varstva pri dobavitelju; 2034 dosedanja predpostavka (krog 4–5)
  # F1: moč TČ kot v opazovani praksi paketa istega obdobja (mediana W/m², 01_fond paket_osnovni); energent brez EI: porazdelitev paketa istega obdobja
  seme_k42: 4242
